<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 240px; margin: 10px; }
  label { display: block; margin: 8px 0 3px; }
  select, button { width: 100%; padding: 4px; }
  button { margin-top: 12px; }
  #status { margin-top: 8px; color: #666; min-height: 1.2em; }
</style>
<label>Format
  <select id="format">
    <option value="mp3">MP3</option>
    <option value="m4a">M4A (AAC)</option>
    <option value="opus">Opus</option>
    <option value="flac">FLAC</option>
  </select>
</label>
<label>Quality
  <select id="quality">
    <option value="0">Best</option>
    <option value="5">Medium</option>
    <option value="9">Smallest</option>
  </select>
</label>
<button id="dl">Download this video's audio</button>
<div id="status"></div>
<script src="popup.js"></script>
